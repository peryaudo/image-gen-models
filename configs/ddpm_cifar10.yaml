run_name: ddpm_cifar10
out_dir: runs
seed: 0

data:
  dataset: cifar10
  resolution: 32
  hflip: true
  num_workers: 8

# Same U-Net as configs/fm_cifar10.yaml (fair comparison). Only time_scale differs, because DDPM
# feeds integer timesteps t in [0, 999] directly; FM feeds t in [0, 1] scaled by 1000.
model:
  in_channels: 3
  resolution: ${data.resolution}
  base_channels: 128
  channel_mult: [1, 2, 2, 2]  # one entry per level; 32 -> 16 -> 8 -> 4
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  time_scale: 1.0

diffusion:
  schedule: linear  # linear (DDPM paper baseline) | cosine (optional ablation)
  num_steps: 1000  # T
  beta_start: 1.0e-4  # linear schedule only
  beta_end: 0.02  # linear schedule only
  cosine_s: 0.008  # cosine schedule only: small offset so beta_1 is not ~0

# Optimizer, batch size, steps, and EMA identical to flow matching.
train:
  batch_size: 128
  max_steps: 100000
  lr: 2.0e-4
  betas: [0.9, 0.999]
  warmup_steps: 5000  # linear lr warmup from 0
  grad_clip: 1.0
  ema_decay: 0.9999
  resume: true  # continue from runs/<run_name>/last.pt if it exists
  overfit_batch: false  # smoke test: train on a single repeated batch
  log_every: 100
  sample_every: 5000
  ckpt_every: 5000

sample:
  n: 64  # 8x8 grid
  ancestral: true  # also save a 1000-step ancestral grid each time (~1 min on a 3090)
  ddim_steps: [10, 20, 50]  # DDIM step counts shown in each periodic grid
  seed: 1234

wandb:
  entity: peryaudo
  project: image-gen-models
